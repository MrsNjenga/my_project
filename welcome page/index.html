<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Dynamic Welcome</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Floating Particles -->
    <div class="particles">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Main Container -->
    <div class="hero">

        <div class="glass-card">

            <div class="badge">
                ⚡ AI POWERED EXPERIENCE
            </div>

            <h1 id="dynamicText">
                WELCOME
            </h1>

            <p class="description">
                Enter a futuristic digital universe filled with
                stunning animations, glowing effects and real-time interaction.
            </p>

            <!-- Live Clock -->
            <div class="live-box">
                <div class="label">LIVE TIME</div>
                <div id="clock">00:00:00</div>
            </div>

            <!-- Buttons -->
            <div class="buttons">

                <button class="primary-btn" id="launchBtn">
                    Launch Experience
                </button>

                <button class="secondary-btn">
                    Discover More
                </button>

            </div>

            <!-- Bottom Stats -->
            <div class="stats">

                <div class="stat-card">
                    <h2>99%</h2>
                    <p>Performance</p>
                </div>

                <div class="stat-card">
                    <h2>24/7</h2>
                    <p>Live System</p>
                </div>

                <div class="stat-card">
                    <h2>∞</h2>
                    <p>Innovation</p>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
