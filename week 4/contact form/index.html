<!-- index.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Contact Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="container">

  <div class="contact-box">

    <div class="left">

      <h1>Contact Us</h1>

      <p>
        We would love to hear from you. Send your message and experience a futuristic contact form design.
      </p>

      <div class="info">

        <div class="card">
          <span>📧</span>
          <h3>Email</h3>
          <p>support@example.com</p>
        </div>

        <div class="card">
          <span>📞</span>
          <h3>Phone</h3>
          <p>+254 700 000 000</p>
        </div>

        <div class="card">
          <span>📍</span>
          <h3>Location</h3>
          <p>Nairobi, Kenya</p>
        </div>

      </div>

    </div>

    <div class="right">

      <form id="contactForm">

        <div class="input-box">
          <input type="text" required>
          <label>Full Name</label>
        </div>

        <div class="input-box">
          <input type="email" required>
          <label>Email Address</label>
        </div>

        <div class="input-box">
          <input type="text" required>
          <label>Subject</label>
        </div>

        <div class="input-box textarea-box">
          <textarea required></textarea>
          <label>Your Message</label>
        </div>

        <button type="submit">Send Message</button>

      </form>

    </div>

  </div>

</div>

<script src="script.js"></script>
</body>
</html>
