<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Text Preview</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <div class="input-box">

            <h2>Live Text Editor</h2>

            <textarea 
                id="textInput"
                placeholder="Type something amazing..."
            ></textarea>

            <div class="buttons">

                <button onclick="changeStyle('bold')">
                    Bold
                </button>

                <button onclick="changeStyle('italic')">
                    Italic
                </button>

                <button onclick="changeStyle('uppercase')">
                    UPPER
                </button>

                <button onclick="clearText()">
                    Clear
                </button>

            </div>

        </div>

        <div class="preview-box">

            <h2>Live Preview</h2>

            <div id="preview">
                Your text will appear here...
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
